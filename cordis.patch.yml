# dsh-threadbridge is an additive Host layer.  The Web/base profile remains
# the owner of storage, session, Agent and Typert composition; this row only
# mounts the plugin after those public services are available.
#
# The loader must fail if any required service is absent.  Do not replace or
# disable base rows here: the plugin is not a standalone DSH profile.
- insert:
    - id: codex-handoff
      name: dsh-threadbridge
      inject:
        - agents
        - agentDefaultModel
        - sessionQuery
        - sessionPersistence
        - workspaceRegistry
        - storageDomain
        - typert
